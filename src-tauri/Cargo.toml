[package]
name = "picture-viewer"
version = "0.2.0"
description = "图片批注查看器 - 轻量图片查看 + 可编辑批注工具"
authors = ["shrimp"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
screenshots = "0.8"
image = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
